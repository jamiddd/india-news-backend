version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_backend_prod
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://news_user:${POSTGRES_PASSWORD:-news_password}@postgres:5432/news_db
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ASTROJSON_API_KEY=${ASTROJSON_API_KEY:-}
      - HOROSCOPE_ENABLED=${HOROSCOPE_ENABLED:-true}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - FIREBASE_CREDENTIALS_PATH=/run/secrets/firebase-service-account.json
      # Optional — error tracking is a no-op until this is actually set in
      # the droplet's .env. See app/main.py.
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      # Firebase Admin SDK service-account key — scp'd onto the host once,
      # never committed/baked into the image. FIREBASE_CREDENTIALS_HOST_PATH
      # is set in the droplet's .env, same mechanism as POSTGRES_PASSWORD etc.
      - ${FIREBASE_CREDENTIALS_HOST_PATH}:/run/secrets/firebase-service-account.json:ro
    ports:
      # Bound to localhost only — the system-level Caddy (see
      # india-news-app-handoff.md §8b) reverse-proxies HTTPS traffic to
      # 127.0.0.1:8080, so this must stay published, but it should never
      # be reachable directly from the public internet. Not "8080:8000"
      # (which binds 0.0.0.0) — that would expose plain HTTP publicly.
      - "127.0.0.1:8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  crossword_scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_crossword_scheduler_prod
    restart: always
    command: ["python3", "scripts/run_crossword_scheduler.py"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://news_user:${POSTGRES_PASSWORD:-news_password}@postgres:5432/news_db
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: news_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news_password}
      POSTGRES_DB: news_db
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_user -d news_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: news_redis_prod
    restart: always
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_prod:
  redis_data_prod:
