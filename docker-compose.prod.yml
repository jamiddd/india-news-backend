services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_backend_prod
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      # Connection budget — see app/database.py for the arithmetic.
      # Every container here builds its own engine, and both droplets
      # share one 15-client Supabase session pooler.
      - DB_POOL_SIZE=${DB_POOL_SIZE:-2}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-0}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      # true ONLY when DATABASE_URL is the transaction pooler (6543).
      - DB_PGBOUNCER=${DB_PGBOUNCER:-false}
      - REDIS_URL=${REDIS_URL}
      # The multi-source feed gate. On by default (see app/config.py); listed
      # here because nothing else in this file passes it, so without this line
      # setting it in .env would silently do nothing. Set FEED_GATE_ENABLED=false
      # in .env and restart to back it out without a code change or a rebuild.
      - FEED_GATE_ENABLED=${FEED_GATE_ENABLED:-true}
      - FEED_MIN_DISTINCT_SOURCES=${FEED_MIN_DISTINCT_SOURCES:-2}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Sarvam TTS for Timeline/Context narration audio (see
      # app/services/timeline_audio.py). Also listed under the narrator
      # service below — that's the service the nightly cycle runs in, but
      # the manual backfill script (scripts/backfill_timeline_audio.py) is
      # run via `exec app`, and generate_audio() no-ops when this is unset.
      # Listed here too so both paths work.
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      # Legacy (Gemini TTS was replaced by Sarvam): no longer read by any
      # code, kept so existing .env files keep working unchanged.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Quote of the Day backgrounds live in a public Supabase Storage
      # bucket in the same project as the database. The service key only
      # lists the bucket; clients read the public object urls directly.
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      - EDITORIAL_BACKGROUND_BUCKET=${EDITORIAL_BACKGROUND_BUCKET:-editorial-backgrounds}
      - ASTROJSON_API_KEY=${ASTROJSON_API_KEY:-}
      - HOROSCOPE_ENABLED=${HOROSCOPE_ENABLED:-true}
      - APIVERVE_API_KEY=${APIVERVE_API_KEY:-}
      - POLL_ADMIN_USERNAME=${POLL_ADMIN_USERNAME:-admin}
      - POLL_ADMIN_PASSWORD=${POLL_ADMIN_PASSWORD:-}
      - POLL_SESSION_SECRET=${POLL_SESSION_SECRET:-}
      - POLL_VOTER_HASH_SECRET=${POLL_VOTER_HASH_SECRET:-}
      # Donations. Absent keys make POST /api/v1/donations/link return 503;
      # an absent webhook secret makes the webhook refuse everything rather
      # than record unverified payments. Only the `app` service needs these.
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - FIREBASE_CREDENTIALS_PATH=/run/secrets/firebase-service-account.json
      # Play Billing purchase verification (POST /api/v1/billing/verify-purchase,
      # see app/services/play_billing.py). Only the `app` service needs this —
      # it's the only place that endpoint runs. Absent = the endpoint returns
      # 503 rather than trusting an unverified purchase.
      - GOOGLE_PLAY_SERVICE_ACCOUNT_PATH=/run/secrets/play-billing-service-account.json
      - ANDROID_PACKAGE_NAME=${ANDROID_PACKAGE_NAME:-com.jamid.news}
      # Optional — error tracking is a no-op until this is actually set in
      # the droplet's .env. See app/main.py.
      - SENTRY_DSN=${SENTRY_DSN:-}
      # Developer alerts (FCM admin-alerts topic + Brevo email), independent
      # of ADMIN_USER_EMAIL's device-token push — see admin_notify.py. This
      # is the `app` container, where process_breaking_cycle actually runs
      # (piggybacked on the poll cycle), so it needs these too, not just
      # pollworker below. Brevo's HTTP API, not SMTP — DigitalOcean blocks
      # outbound SMTP ports account-wide (see admin_email.py).
      - ADMIN_ALERT_TOPIC=${ADMIN_ALERT_TOPIC:-admin-alerts}
      - ADMIN_ALERT_EMAIL_TO=${ADMIN_ALERT_EMAIL_TO:-}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-}
    volumes:
      # Firebase Admin SDK service-account key — scp'd onto the host once,
      # never committed/baked into the image. FIREBASE_CREDENTIALS_HOST_PATH
      # is set in the droplet's .env, same mechanism as POSTGRES_PASSWORD etc.
      - ${FIREBASE_CREDENTIALS_HOST_PATH}:/run/secrets/firebase-service-account.json:ro
      # Play Billing service-account key — same scp'd-once, never-committed
      # convention as Firebase's above. A distinct service account (not the
      # Firebase one), scoped only to "View financial data" for this app in
      # Play Console — see app/services/play_billing.py's module doc.
      - ${GOOGLE_PLAY_SERVICE_ACCOUNT_HOST_PATH}:/run/secrets/play-billing-service-account.json:ro
    ports:
      # Bound to localhost only — the system-level Caddy (see
      # india-news-app-handoff.md §8b) reverse-proxies HTTPS traffic to
      # 127.0.0.1:8080, so this must stay published, but it should never
      # be reachable directly from the public internet. Not "8080:8000"
      # (which binds 0.0.0.0) — that would expose plain HTTP publicly.
      - "127.0.0.1:8080:8000"

  # Renamed from crossword_scheduler 2026-09-16 — despite the script name
  # (run_crossword_scheduler.py, unchanged below), this also pre-generates
  # sudoku/word search/spelling bee/word ladder/quiz/editorial backgrounds/
  # horoscope every night. "crossword" undersold what this container does.
  contentworker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_contentworker_prod
    restart: always
    command: ["python3", "scripts/run_crossword_scheduler.py"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      # Connection budget — see app/database.py for the arithmetic.
      # Every container here builds its own engine, and both droplets
      # share one 15-client Supabase session pooler.
      - DB_POOL_SIZE=${DB_POOL_SIZE:-2}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-0}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      # true ONLY when DATABASE_URL is the transaction pooler (6543).
      - DB_PGBOUNCER=${DB_PGBOUNCER:-false}
      - REDIS_URL=${REDIS_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # This container also pre-generates sudoku/word search/spelling bee/
      # word ladder/quiz/editorial each night (see run_crossword_scheduler.py
      # despite the name), all of which now try APIVerve first.
      - APIVERVE_API_KEY=${APIVERVE_API_KEY:-}
      # Missing here until 2026-09-12 — the horoscope prewarm silently no-op'd
      # every night (get_or_create_horoscope only fetches live per-user-request).
      - ASTROJSON_API_KEY=${ASTROJSON_API_KEY:-}
      - HOROSCOPE_ENABLED=${HOROSCOPE_ENABLED:-true}

  # Renamed from poll_scheduler 2026-09-16 (naming pass, de-underscored —
  # script name below is unchanged).
  pollworker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_pollworker_prod
    restart: always
    command: ["python3", "scripts/run_poll_scheduler.py"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      # Connection budget — see app/database.py for the arithmetic.
      # Every container here builds its own engine, and both droplets
      # share one 15-client Supabase session pooler.
      - DB_POOL_SIZE=${DB_POOL_SIZE:-2}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-0}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      # true ONLY when DATABASE_URL is the transaction pooler (6543).
      - DB_PGBOUNCER=${DB_PGBOUNCER:-false}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ADMIN_USER_EMAIL=${ADMIN_USER_EMAIL:-}
      - ADMIN_POLL_REVIEW_URL=${ADMIN_POLL_REVIEW_URL:-https://admin.openindiannews.com/polls}
      # Needed to send the admin draft-ready FCM push — see
      # notify_admin_draft_ready() in app/services/polls.py.
      - FIREBASE_CREDENTIALS_PATH=/run/secrets/firebase-service-account.json
      # Developer alerts — see admin_notify.py / the `app` service above.
      - ADMIN_ALERT_TOPIC=${ADMIN_ALERT_TOPIC:-admin-alerts}
      - ADMIN_ALERT_EMAIL_TO=${ADMIN_ALERT_EMAIL_TO:-}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-}
    volumes:
      - ${FIREBASE_CREDENTIALS_HOST_PATH}:/run/secrets/firebase-service-account.json:ro

  # Renamed from timeline_scheduler 2026-09-16 (does narrative generation
  # AND audio synthesis for the Timeline tab, not just scheduling).
  #
  # SINGLETON, like contentworker/pollworker above — start this with
  # `docker compose up -d narrator` (or a plain `up -d`) on newsapp ONLY,
  # never on newsapp-2 (`up -d app` there, as with the other two
  # schedulers). Two independent daemons would race to write the same
  # story_timeline_features rows and double the LLM spend; the DB
  # connection budget (one 15-client Supabase pooler shared by both
  # droplets) is also sized assuming these schedulers are single-instance.
  #
  # This is now also enforced structurally, not just by this comment — see
  # run_timeline_scheduler.py's _assert_primary_host(), gated on
  # PRIMARY_SCHEDULER_HOST below. A rogue duplicate ran on newsapp-2 for 4
  # days (2026-09-12 to 2026-09-16) before this guard existed.
  narrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_narrator_prod
    restart: always
    command: ["python3", "scripts/run_timeline_scheduler.py"]
    environment:
      # Must be exactly "newsapp", and ONLY set in newsapp's .env — see
      # run_timeline_scheduler.py's _assert_primary_host(). Deliberately
      # not defaulted (no :-fallback) so an .env that forgets this fails
      # loudly (container exits) instead of silently starting a second
      # scheduler on the wrong droplet.
      - PRIMARY_SCHEDULER_HOST=${PRIMARY_SCHEDULER_HOST}
      - DATABASE_URL=${DATABASE_URL}
      # Connection budget — see app/database.py for the arithmetic.
      # Every container here builds its own engine, and both droplets
      # share one 15-client Supabase session pooler.
      - DB_POOL_SIZE=${DB_POOL_SIZE:-2}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-0}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      # true ONLY when DATABASE_URL is the transaction pooler (6543).
      - DB_PGBOUNCER=${DB_PGBOUNCER:-false}
      # story_chains.py's load_clusters/load_baseline_rates cache their DB
      # reads here (best-effort — _cache_get/_cache_set swallow Redis
      # errors) rather than duplicating the egress on every scheduler run
      # AND every /clusters/{id}/timeline or /related request.
      - REDIS_URL=${REDIS_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Spoken narration TTS (app/services/timeline_audio.py) — reuses the
      # `app` service's Supabase project/bucket credentials below for
      # storage; this is only the Sarvam key. Absent = no audio, narrative
      # generation is unaffected.
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      # Legacy (Gemini TTS was replaced by Sarvam), kept so existing .env
      # files keep working unchanged.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TIMELINE_AUDIO_BUCKET=${TIMELINE_AUDIO_BUCKET:-timeline-audio}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      # Developer alerts — run_timeline_scheduler.py's failure path calls
      # notify_admin_failure() (email-only), and each finished cycle sends the
      # "timelines generated" push + email via notify_admin_timelines_generated(),
      # so this container also needs the FCM credentials and the admin
      # device/topic settings, like pollworker above. See admin_notify.py /
      # the `app` service above.
      - ADMIN_USER_EMAIL=${ADMIN_USER_EMAIL:-}
      - FIREBASE_CREDENTIALS_PATH=/run/secrets/firebase-service-account.json
      - ADMIN_ALERT_TOPIC=${ADMIN_ALERT_TOPIC:-admin-alerts}
      - ADMIN_ALERT_EMAIL_TO=${ADMIN_ALERT_EMAIL_TO:-}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-}
    volumes:
      - ${FIREBASE_CREDENTIALS_HOST_PATH}:/run/secrets/firebase-service-account.json:ro

  # Daily Brief scheduler (scripts/run_daily_brief_scheduler.py): builds the
  # 05:00 IST brief of yesterday's top stories (Claude script + Sarvam audio).
  # SINGLETON like narrator above — newsapp ONLY, never newsapp-2; enforced by
  # the same PRIMARY_SCHEDULER_HOST guard.
  briefer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_briefer_prod
    restart: always
    command: ["python3", "scripts/run_daily_brief_scheduler.py"]
    environment:
      # Must be exactly "newsapp", and ONLY set in newsapp's .env — see
      # run_daily_brief_scheduler.py's _assert_primary_host(). Deliberately
      # not defaulted (no :-fallback) so an .env that forgets this fails
      # loudly (container exits) instead of silently starting a second
      # scheduler on the wrong droplet.
      - PRIMARY_SCHEDULER_HOST=${PRIMARY_SCHEDULER_HOST}
      - DATABASE_URL=${DATABASE_URL}
      # Connection budget — see app/database.py for the arithmetic.
      # Every container here builds its own engine, and both droplets
      # share one 15-client Supabase session pooler.
      - DB_POOL_SIZE=${DB_POOL_SIZE:-2}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-0}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      # true ONLY when DATABASE_URL is the transaction pooler (6543).
      - DB_PGBOUNCER=${DB_PGBOUNCER:-false}
      # story_chains.py's load_clusters/load_baseline_rates cache their DB
      # reads here (best-effort — _cache_get/_cache_set swallow Redis
      # errors) rather than duplicating the egress on every scheduler run
      # AND every /clusters/{id}/timeline or /related request.
      - REDIS_URL=${REDIS_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Spoken narration TTS (app/services/timeline_audio.py) — reuses the
      # `app` service's Supabase project/bucket credentials below for
      # storage; this is only the Sarvam key. Absent = no audio, narrative
      # generation is unaffected.
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      # Legacy (Gemini TTS was replaced by Sarvam), kept so existing .env
      # files keep working unchanged.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TIMELINE_AUDIO_BUCKET=${TIMELINE_AUDIO_BUCKET:-timeline-audio}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      # Developer alerts — run_daily_brief_scheduler.py's failure path calls
      # notify_admin_failure() (email-only), and each finished cycle sends the
      # "timelines generated" push + email via notify_admin_timelines_generated(),
      # so this container also needs the FCM credentials and the admin
      # device/topic settings, like pollworker above. See admin_notify.py /
      # the `app` service above.
      - ADMIN_USER_EMAIL=${ADMIN_USER_EMAIL:-}
      - FIREBASE_CREDENTIALS_PATH=/run/secrets/firebase-service-account.json
      - ADMIN_ALERT_TOPIC=${ADMIN_ALERT_TOPIC:-admin-alerts}
      - ADMIN_ALERT_EMAIL_TO=${ADMIN_ALERT_EMAIL_TO:-}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-}
    volumes:
      - ${FIREBASE_CREDENTIALS_HOST_PATH}:/run/secrets/firebase-service-account.json:ro
